<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL — CORE 1/2 Rewire Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050a14;color:#fff;font-family:monospace}
body{display:flex;justify-content:center;padding:12px}
#gameBox{width:100%;max-width:450px}
#menu{min-height:600px;display:flex;align-items:center;justify-content:center}
.menu-box{width:100%;padding:24px;border:1px solid #315579;border-radius:14px;background:#0a1628;text-align:center}
button{font:inherit;color:#fff;background:#0d2035;border:1px solid #315579;border-radius:8px;padding:10px 14px;cursor:pointer;width:100%;margin-top:10px}
button:disabled{opacity:.45;cursor:not-allowed}
#bootStatus{margin:18px 0;text-align:left;font-size:11px;line-height:1.8}
.ok{color:#65e6a5}.bad{color:#ff7180}.wait{color:#ffd35a}
#fatal{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;max-width:900px;margin:auto;padding:12px;background:#240d12;border:1px solid #a54b57;border-radius:8px;color:#ffdfe3;white-space:pre-wrap;font:12px monospace}
.hidden{display:none!important}
#game{width:100%}
#eventLog{min-height:20px;text-align:center}
.map-wrap{position:relative;min-height:440px;overflow:hidden;background:#0a1628;border:1px solid #315579;border-radius:12px;padding:16px 10px}
#map{position:relative;z-index:2;min-height:400px}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bottomContainer{margin-top:8px}
#modal,#pokePreview{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.78)}
#modalContent,.preview-box{width:100%;max-width:450px;background:#0a1628;border:1px solid #315579;border-radius:12px;padding:14px}
#pokePreview{display:none}
#ppSprite{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}
</style>
</head>
<body>
<main id="gameBox">
<section id="menu">
<div class="menu-box">
<h1>⚡ PokeMisteryRL</h1>
<p>CORE 1 → TEAM → CORE 2</p>
<div id="bootStatus">
<div id="b1" class="wait">⏳ DB Pokémon</div>
<div id="b2" class="wait">⏳ DB Mosse</div>
<div id="b3" class="wait">⏳ CORE 1</div>
<div id="b4" class="wait">⏳ TEAM REGION</div>
<div id="b5" class="wait">⏳ LEVEL SYSTEM</div>
<div id="b6" class="wait">⏳ SKILL SYSTEM</div>
<div id="b7" class="wait">⏳ DB ITEMS</div>
<div id="b8" class="wait">⏳ CORE 2</div>
<div id="b9" class="wait">⏳ start()</div>
</div>
<button id="startButton" disabled>⏳ TEST IN CORSO...</button>
</div>
</section>

<section id="game" class="hidden">
<div id="eventLog"></div>
<div class="map-wrap"><svg id="mapSvg"></svg><div id="map"></div></div>
<div id="bottomContainer"></div>
<div id="runLogHeader">LOG RUN</div>
<div id="runLogContent"></div>
</section>

<div id="modal" class="hidden"><div id="modalContent"></div></div>
<div id="pokePreview" class="hidden"><div class="preview-box">
<img id="ppSprite" src="" alt="">
<h2 id="ppName">—</h2>
<div id="ppLevel">LV 1</div>
<div id="ppTypes"></div>
<div id="ppCustomContent"></div>
<button type="button" onclick="closeTeamPreview?.()">CHIUDI</button>
</div></div>
</main>
<div id="fatal"></div>

<!-- DATABASE -->
<script src="./DB_PKM.js"></script>
<script src="./MOSSE_PKM.js"></script>

<!-- CORE 1 -->
<script src="./CORE_1_BASE.js"></script>

<!-- REGIONS / DB USED BY CORE 1/2 -->
<script src="./LEVEL_SYSTEM_REGION.js"></script>
<script src="./SKILL_SYSTEM_REGION.js"></script>
<script src="./DB_ITEMS.js"></script>

<script>
/*
 * REWIRE TEST
 *
 * CORE_1_BASE.js crea PokeMisteryRL e TeamRoster inline.
 * Il file TEAM_SYSTEM_REGION.js non va caricato sopra CORE 1:
 * richiede PokeMisteryRL già creato e il CORE 1 contiene ancora
 * la copia inline. Per testare il collegamento senza doppiare il
 * sistema, forniamo qui soltanto il modulo Team minimo che CORE 1
 * richiede: getCombinedTeam + getTeamStats.
 *
 * Non sostituisce TeamRoster e non duplica la regione estratta.
 */
if (window.PokeMisteryRL && !window.PokeMisteryRL.Team) {
  window.PokeMisteryRL.Team = (() => {
    const getCombinedTeam = () => {
      if (!window.PKM_RUN) return [];
      const out = [];
      if (window.PKM_RUN.activePokemon) out.push(window.PKM_RUN.activePokemon);
      if (window.PKM_RUN.secondActive) out.push(window.PKM_RUN.secondActive);
      if (Array.isArray(window.PKM_RUN.teamSlots)) {
        window.PKM_RUN.teamSlots.forEach(p => { if (p) out.push(p); });
      }
      return out;
    };

    const getTeamStats = () => {
      const team = getCombinedTeam();
      return team.reduce((acc,p) => {
        if (!p?.stats) return acc;
        acc.hp += Number(p.stats.hp)||0;
        acc.atk += Number(p.stats.atk)||0;
        acc.satk += Number(p.stats.satk)||0;
        acc.dif += Number(p.stats.dif)||0;
        acc.spd += Number(p.stats.spd)||0;
        return acc;
      }, {hp:0,atk:0,satk:0,dif:0,spd:0});
    };

    return {getCombinedTeam,getTeamStats};
  })();
}
</script>

<!-- CORE 2: loaded only after the Team bridge exists -->
<script src="./CORE_2_GAMEPLAY.js"></script>

<script>
(function(){
  const $id = id => document.getElementById(id);
  const mark = (id,ok,text) => {
    const e=$id(id); if(!e)return;
    e.className=ok?"ok":"bad";
    e.textContent=(ok?"✅ ":"❌ ")+text;
  };

  window.addEventListener("error", e => {
    const box=$id("fatal");
    box.style.display="block";
    box.textContent="ERRORE JAVASCRIPT\n\n"+(e.error?.stack||e.message||String(e.error||e));
    console.error(e.error||e.message||e);
  });

  window.addEventListener("unhandledrejection", e => {
    const box=$id("fatal");
    box.style.display="block";
    box.textContent="PROMISE REJECTION\n\n"+(e.reason?.stack||e.reason||String(e.reason));
    console.error(e.reason);
  });

  const db = !!window.PKM_ALL;
  const moves = typeof SKILL_DB !== "undefined";
  const core1 = !!window.PokeMisteryRL && !!window.PokeMisteryRL_CoreBridge?.part1Ready;
  const team = !!window.PokeMisteryRL?.Team &&
               typeof window.PokeMisteryRL.Team.getCombinedTeam==="function" &&
               !!window.PokeMisteryRL.TeamRoster;
  const level = typeof PokeMisteryRL_LevelSystem!=="undefined";
  const skill = typeof PokeMisteryRL_SkillSystem!=="undefined";
  const items = !!window.PokeMisteryRL_Items;
  const core2 = !!window.PokeMisteryRL_CoreBridge?.part2Ready;
  const start = typeof window.start==="function";

  mark("b1",db,"DB Pokémon: "+(db?"caricato":"NON caricato"));
  mark("b2",moves,"DB Mosse: "+(moves?"caricato":"NON caricato"));
  mark("b3",core1,"CORE 1: "+(core1?"READY":"NON READY"));
  mark("b4",team,"TEAM: "+(team?"COLLEGATO":"NON COLLEGATO"));
  mark("b5",level,"LEVEL SYSTEM: "+(level?"caricato":"NON caricato"));
  mark("b6",skill,"SKILL SYSTEM: "+(skill?"caricato":"NON caricato"));
  mark("b7",items,"DB ITEMS: "+(items?"caricato":"NON caricato"));
  mark("b8",core2,"CORE 2: "+(core2?"READY":"NON READY"));
  mark("b9",start,"start(): "+(start?"FUNCTION":"NON DISPONIBILE"));

  console.table({
    PKM_ALL:!!window.PKM_ALL,
    SKILL_DB:typeof SKILL_DB,
    PokeMisteryRL:!!window.PokeMisteryRL,
    Team:!!window.PokeMisteryRL?.Team,
    TeamRoster:!!window.PokeMisteryRL?.TeamRoster,
    CORE_1_READY:!!window.PokeMisteryRL_CoreBridge?.part1Ready,
    LEVEL_SYSTEM:typeof PokeMisteryRL_LevelSystem,
    SKILL_SYSTEM:typeof PokeMisteryRL_SkillSystem,
    ITEMS:!!window.PokeMisteryRL_Items,
    CORE_2_READY:!!window.PokeMisteryRL_CoreBridge?.part2Ready,
    start:typeof window.start
  });

  if(core2 && start){
    $id("startButton").disabled=false;
    $id("startButton").textContent="▶ AVVIA RUN";
    $id("startButton").onclick=()=>{
      try{ window.start(); }
      catch(err){
        $id("fatal").style.display="block";
        $id("fatal").textContent="ERRORE DURANTE start()\n\n"+(err.stack||err);
        console.error(err);
      }
    };
  } else {
    $id("startButton").textContent="❌ CORE NON PRONTO";
  }
})();
</script>
</body>
</html>
