<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeMisteryRL</title>


</head><body><main id="gameBox">
<section id="menu"><h1>⚡ PokeMisteryRL</h1><p class="subtitle">ROGUELIKE ADVENTURE</p><button id="startButton" type="button">🎲 RUN CASUALE</button><div id="boot">Caricamento sistema...</div></section>
<section id="game" class="hidden"><div id="eventLog"></div><div class="map-wrap"><svg id="mapSvg" aria-hidden="true"></svg><div id="map" aria-label="Mappa della run"></div></div><div id="bottomContainer"></div><div><div id="runLogHeader" onclick="toggleRunLog()">LOG RUN ▼</div><div id="runLogContent"></div></div></section>
<div id="modal" class="hidden"><div id="modalContent"></div></div>
<div id="pokePreview" class="hidden"><div class="preview-box"><img id="ppSprite" src="" alt=""><h2 id="ppName">—</h2><div id="ppLevel">LV 1</div><div id="ppTypes"></div><div class="bar"><div id="ppHpFill" style="width:100%"></div></div><div id="ppHpText">0/0</div><div>ATK <b id="ppk">0</b></div><div>DEF <b id="ppDef">0</b></div><div>SPD <b id="ppSpd">0</b></div><div id="ppCustomContent"></div><button type="button" onclick="closeTeamPreview();busy=0;PokeMisteryRL.UI.render()">CHIUDI</button></div></div>
</main><div id="fatal" style="display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;max-width:900px;margin:auto;padding:12px;background:#240d12;border:1px solid #a54b57;border-radius:8px;color:#ffdfe3;white-space:pre-wrap;font:12px monospace"></div>
<script src="./DB_PKM.js"></script><script>if(typeof PKM_ALL!=="undefined")window.PKM_ALL=PKM_ALL;</script>
<script src="./MOSSE_PKM.js"></script><script src="./CORE_1_BASE.js"></script>
<script src="./LEVEL_SYSTEM_REGION.js"></script><script src="./SKILL_SYSTEM_REGION.js"></script><script src="./DB_ITEMS.js"></script>
<script src="./CORE_2_GAMEPLAY.js"></script><script src="./RECRUIT_SYSTEM_REGION.js"></script>
<script>
(function(){
const fatal=document.getElementById("fatal"),boot=document.getElementById("boot"),button=document.getElementById("startButton");
function err(x){fatal.style.display="block";fatal.textContent=x;console.error(x)}
window.addEventListener("error",e=>err("ERRORE JAVASCRIPT\n\n"+(e.error?.stack||e.message||String(e.error||e))));
window.addEventListener("unhandledrejection",e=>err("PROMISE REJECTION\n\n"+(e.reason?.stack||e.reason||String(e.reason))));
button.addEventListener("click",function(){
 if(typeof window.start!=="function"){err("window.start non è disponibile.\n\nIl CORE attuale non espone ancora una funzione start().");return}
 try{window.start()}catch(e){err("ERRORE DURANTE LA RUN\n\n"+(e?.stack||e))}
});
console.table({PKM_ALL:!!window.PKM_ALL,MOSSE:typeof SKILL_DB,CORE_1:!!window.PokeMisteryRL_CoreBridge?.part1Ready,LEVEL:typeof window.PokeMisteryRL_LevelSystem,SKILL:typeof window.PokeMisteryRL_SkillSystem,ITEMS:!!window.PokeMisteryRL_Items,CORE_2:!!window.PokeMisteryRL_CoreBridge?.part2Ready,START:typeof window.start});
boot.textContent=typeof window.start==="function"?"✅ Sistema pronto":"⚠️ CORE caricato — start() non esposto";
})();
</script></body></html>
