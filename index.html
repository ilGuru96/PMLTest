<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#050a14;
  color:#fff;
  font-family:monospace;
}

body{
  display:flex;
  justify-content:center;
  padding:10px;
}

button{
  font:inherit;
  color:inherit;
  background:#0d2035;
  border:1px solid #315579;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

button:hover{background:#153453}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}

#gameBox{
  width:100%;
  max-width:450px;
  min-height:600px;
  position:relative;
}

/* =========================================================
   MENU
   ========================================================= */

#menu{
  min-height:600px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu-box{
  width:100%;
  padding:24px;
  border:1px solid #315579;
  border-radius:14px;
  background:#0a1628;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.menu-box h1{
  margin:0 0 8px;
  font-size:25px;
}

.menu-box p{
  opacity:.65;
  font-size:11px;
  line-height:1.5;
}

.menu-box button{
  width:100%;
  margin-top:8px;
  font-weight:bold;
}

/* =========================================================
   GAME / MAPPA
   ========================================================= */

#game{width:100%}

#eventLog{
  min-height:20px;
  margin:7px 0;
  text-align:center;
  font-size:11px;
  color:#55d9ff;
}

.main-layout{
  width:100%;
}

.map-wrap{
  position:relative;
  width:100%;
  height:440px;
  overflow:hidden;
  background:#0a1628;
  border:1px solid #315579;
  border-radius:12px;
  padding:16px 10px;
}

.map-wrap:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:18px 18px;
  z-index:0;
}

#map{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  min-height:400px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:4px;
}

#mapSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
  overflow:visible;
}

.map-row{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:8px;
  min-height:46px;
}

.node{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-radius:50%;
  border:1px solid #315579;
  background:#10243a;
  font-size:18px;
  user-select:none;
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
}

.node:hover{transform:scale(1.05)}

.node.available{
  border-color:#55d9ff;
  box-shadow:0 0 12px rgba(85,217,255,.25);
  cursor:pointer;
}

.node.current{
  border-color:#ffd35a;
  box-shadow:0 0 12px rgba(255,211,90,.2);
}

.node.done{opacity:.8}

.node.locked,
.node.map-placeholder{
  opacity:.28;
}

.node.boss{border-color:#ff5964}
.node.shop{border-color:#ffd35a}
.node.skill{border-color:#c47cff}
.node.meat{border-color:#ff9f5c}
.node.event{border-color:#fff}
.node.rifugio{border-color:#55d9ff}
.node.free{border-color:#55d9ff}

.node img{
  width:34px;
  height:34px;
  object-fit:contain;
  image-rendering:pixelated;
}

.map-enemy-preview-crop{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.map-enemy-preview-final{
  max-width:34px;
  max-height:34px;
  object-fit:contain;
  image-rendering:pixelated;
}

.map-sword-final{
  position:absolute;
  right:-4px;
  bottom:-5px;
  font-size:13px;
}

.map-line{
  stroke:#315579;
  stroke-width:2;
  opacity:.45;
}

.map-line.available{
  stroke:#55d9ff;
  stroke-width:2.5;
  opacity:.9;
}

.map-line.done{
  stroke:#55d9ff;
  opacity:.7;
}

/* =========================================================
   BOTTOM PANEL — CORE 2 v8
   Il pannello viene costruito dal JS.
   ========================================================= */

#bottomContainer{
  width:100%;
  margin-top:8px;
}

#bottomPanel.bottom-v8{
  width:100%;
  min-height:142px;
  display:grid;
  grid-template-columns:74px minmax(0,1fr) 92px;
  gap:7px;
  padding:7px;
  background:linear-gradient(145deg,#112746,#0a182c);
  border:1px solid #294b70;
  border-radius:16px;
  box-shadow:
    0 8px 20px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.b8-left{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.b8-pokemon-slot{
  width:100%;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(49,85,121,.8);
  border-radius:10px;
  background:#071321;
  cursor:pointer;
}

.b8-pokemon-slot img{
  max-width:62px;
  max-height:62px;
  object-fit:contain;
  image-rendering:pixelated;
}

#starter2Placeholder{
  font-size:9px;
  opacity:.55;
}

.b8-center{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.b8-top{
  min-width:0;
  display:flex;
  align-items:center;
  gap:5px;
}

.b8-name{
  min-width:0;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-weight:bold;
}

.b8-lv{
  flex:0 0 auto;
  padding:3px 5px;
  border:1px solid rgba(49,85,121,.65);
  border-radius:5px;
  font-size:9px;
}

.b8-typing{
  display:flex;
  gap:2px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.b8-typing .type-badge{
  margin:0;
}

.b8-bars{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.b8-bar-row{
  display:grid;
  grid-template-columns:14px minmax(0,1fr) auto;
  align-items:center;
  gap:4px;
  min-width:0;
}

.b8-icon{
  font-size:10px;
}

.b8-bar-bg{
  width:100%;
  height:7px;
  overflow:hidden;
  border-radius:5px;
  background:#10151c;
  border:1px solid rgba(49,85,121,.45);
}

.b8-fill{
  height:100%;
  width:0;
  transition:width .2s ease;
}

.b8-fill.hp{background:#55d9ff}
.b8-value{
  font-size:8px;
  white-space:nowrap;
  opacity:.75;
}

.b8-stats{
  display:flex;
  justify-content:space-between;
  gap:4px;
  font-size:9px;
}

.b8-stats b{font-size:11px}

.b8-s2-section{
  padding-top:4px;
  border-top:1px solid rgba(49,85,121,.4);
}

.b8-s2-header{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:3px;
}

.b8-s2-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:9px;
  font-weight:bold;
}

.b8-s2-level{font-size:8px}

.b8-s2-typing{
  grid-column:1 / -1;
  justify-content:flex-start;
}

.b8-quick-items{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
  margin-top:auto;
}

.b8-quick-item{
  min-width:0;
  height:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(49,85,121,.6);
  border-radius:5px;
  background:#071321;
  overflow:hidden;
  cursor:pointer;
}

.b8-quick-item.empty{opacity:.45}
.quick-item-icon{font-size:12px;line-height:1}
.b8-quick-item small{font-size:7px;opacity:.8}

.b8-right{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.b8-right-main{
  display:flex;
  flex-direction:column;
  gap:5px;
  height:100%;
}

.b8-money{
  text-align:center;
  font-size:11px;
  padding:3px;
  border:1px solid rgba(49,85,121,.55);
  border-radius:6px;
}

.b8-incubator{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:4px;
  border:1px solid rgba(49,85,121,.55);
  border-radius:6px;
  font-size:8px;
  text-align:center;
}

.b8-incubator>span{font-size:16px}

.b8-incubator small{
  display:block;
  opacity:.65;
  margin-top:2px;
}

.b8-team-viewer{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:3px;
  border:1px solid rgba(49,85,121,.55);
  border-radius:7px;
  background:rgba(7,19,33,.55);
}

.b8-team-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  font-size:7px;
  opacity:.75;
}

.b8-team-image-wrap{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:2px;
}

.b8-team-image-wrap img{
  width:42px;
  height:42px;
  object-fit:contain;
  image-rendering:pixelated;
}

.team-nav{
  width:18px;
  height:18px;
  padding:0;
  border-radius:4px;
  font-size:8px;
}

.b8-team-viewer-name{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:7px;
}

.b8-team-viewer-level{
  font-size:7px;
  opacity:.6;
}

.b8-inventory-btn{
  width:100%;
  padding:5px 2px;
  font-size:7px;
}

.b8-inventory-panel{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:4px;
  border:1px solid rgba(49,85,121,.55);
  border-radius:7px;
  background:rgba(7,19,33,.55);
}

.b8-inventory-title{
  font-size:8px;
  font-weight:bold;
  text-align:center;
}

.b8-inventory-section{
  font-size:7px;
}

.inventory-list{
  max-height:38px;
  overflow:auto;
  margin-top:2px;
}

.inventory-entry{
  display:flex;
  align-items:center;
  gap:3px;
  padding:2px 0;
  font-size:7px;
}

.inventory-icon{font-size:10px}
.inventory-name{
  min-width:0;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.inventory-empty{
  opacity:.45;
  font-size:7px;
}

.b8-inventory-incubator{
  font-size:7px;
  opacity:.7;
}

.b8-inventory-close{
  margin-top:auto;
  width:100%;
  padding:4px;
  font-size:7px;
}

/* =========================================================
   LOG
   ========================================================= */

.run-log-panel{
  margin-top:8px;
  border:1px solid rgba(49,85,121,.5);
  border-radius:8px;
  overflow:hidden;
}

.run-log-toggle{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:0;
  border-radius:0;
  padding:7px 8px;
  background:#0d2035;
  font-size:9px;
}

.run-log-content{
  display:none;
  max-height:120px;
  overflow:auto;
  padding:6px 8px;
  font-size:8px;
  text-align:left;
}

.run-log-line{
  margin:2px 0;
  opacity:.8;
}

/* =========================================================
   MODALI
   ========================================================= */

#modal,
#pokePreview,
#pokeInfo{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.78);
}

#modalContent{
  width:100%;
  max-width:450px;
}

.center,
.modal-box,
.preview-box{
  max-width:450px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:#0a1628;
  border:1px solid #315579;
  border-radius:12px;
  padding:14px;
}

#pokePreview .preview-box{text-align:center}

#ppSprite{
  width:96px;
  height:96px;
  object-fit:contain;
  image-rendering:pixelated;
}

.type-badge{
  display:inline-block;
  padding:2px 5px;
  margin:2px;
  border-radius:4px;
  font-size:8px;
  color:#fff;
}

.bar{
  width:100%;
  height:7px;
  margin:4px 0;
  overflow:hidden;
  border-radius:5px;
  background:#111;
}

.bar>div{
  height:100%;
  background:#55d9ff;
}

.danger{border-color:#8b3940}

#blog{
  min-height:45px;
  max-height:110px;
  overflow:auto;
  padding:6px;
  font-size:9px;
  background:rgba(0,0,0,.2);
  border-radius:6px;
}

.bf-sprite{
  position:relative;
}

.bf-sprite img{
  max-width:110px;
  max-height:110px;
  image-rendering:pixelated;
}

.dmg-num{
  position:absolute;
  left:50%;
  top:15%;
  transform:translate(-50%,-50%);
  font-weight:bold;
  font-size:18px;
  pointer-events:none;
}

#fatal{
  display:none;
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:9999;
  max-width:900px;
  margin:auto;
  padding:12px;
  background:#240d12;
  border:1px solid #a54b57;
  border-radius:8px;
  color:#ffdfe3;
  white-space:pre-wrap;
  font:12px monospace;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:390px){
  #bottomPanel.bottom-v8{
    grid-template-columns:64px minmax(0,1fr) 82px;
    gap:5px;
    padding:5px;
  }

  .b8-pokemon-slot{height:58px}
  .b8-pokemon-slot img{max-width:56px;max-height:56px}
  .b8-stats{font-size:8px}
  .b8-stats b{font-size:10px}
}

@media(min-width:700px){
  #gameBox{max-width:520px}
  .map-wrap{height:500px}
  #map{min-height:460px}
}

/* ============================================================
   COMPARATIVE INDEX — VISUAL LAYER
   Solo estetica/compatibilita DOM.
   Nessuna logica di gioco viene sostituita.
   ============================================================ */

/* MAPPA */
.map-wrap{
  min-height:440px;
  padding:18px 12px;
  background:
    radial-gradient(circle at 50% 50%,rgba(20,55,90,.18),transparent 65%),
    #0a1628;
  border-color:#315579;
}

#map{
  min-height:400px;
  gap:12px;
}

.map-row{
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:8px;
  min-height:46px;
}

.node{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:50%;
  border:1px solid #315579;
  background:#10243a;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

.node.available{
  border-color:#55d9ff;
  box-shadow:
    0 0 12px rgba(85,217,255,.25),
    inset 0 0 8px rgba(85,217,255,.08);
}

.node.current{
  border-color:#ffd35a;
  box-shadow:0 0 12px rgba(255,211,90,.22);
}

.node.done{opacity:.8}
.node.locked,
.node.map-placeholder{opacity:.28}

.node.boss{border-color:#ff5964}
.node.shop{border-color:#ffd35a}
.node.skill{border-color:#c47cff}
.node.meat{border-color:#ff9f5c}
.node.event{border-color:#fff}
.node.rifugio{border-color:#55d9ff}
.node.free{border-color:#55d9ff}

.node img{
  width:34px;
  height:34px;
  object-fit:contain;
  image-rendering:pixelated;
}

.map-enemy-preview-crop{
  position:absolute!important;
  left:50%!important;
  top:54%!important;
  width:58px!important;
  height:58px!important;
  transform:translate(-50%,-50%)!important;
  display:block!important;
  overflow:visible!important;
  z-index:30!important;
  pointer-events:none!important;
}

.map-enemy-preview-final{
  position:absolute!important;
  left:50%!important;
  top:50%!important;
  width:58px!important;
  height:58px!important;
  max-width:none!important;
  max-height:none!important;
  transform:translate(-50%,-50%) scale(1.15)!important;
  object-fit:contain!important;
  object-position:50% 50%!important;
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  image-rendering:auto!important;
}

.node.boss .map-enemy-preview-crop{
  width:64px!important;
  height:64px!important;
}

.node.boss .map-enemy-preview-final{
  width:64px!important;
  height:64px!important;
  max-width:none!important;
  max-height:none!important;
}

.map-sword-final{
  position:absolute!important;
  top:-9px!important;
  right:-7px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:22px!important;
  height:22px!important;
  font-size:16px!important;
  line-height:1!important;
  z-index:40!important;
  pointer-events:none!important;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.95))!important;
}

.map-line{
  stroke:#315579;
  stroke-width:2;
  opacity:.45;
}

.map-line.available{
  stroke:#55d9ff;
  stroke-width:2.5;
  opacity:.9;
}

.map-line.done{
  stroke:#55d9ff;
  opacity:.7;
}

/* ============================================================
   BOTTOM V8 — LAYOUT COMPARATIVO
   17% / 59% / 24%
   ============================================================ */

#bottomContainer{
  width:100%;
  margin-top:8px;
  padding:7px;
  border-radius:14px;
  background:linear-gradient(145deg,#10233d,#081525);
  border:1px solid #294e73;
}

#bottomPanel.bottom-v8,
.bottom-v8{
  min-height:140px;
  grid-template-columns:minmax(72px,17fr) minmax(0,59fr) minmax(82px,24fr);
  gap:7px;
  align-items:stretch;
  padding:7px;
  background:linear-gradient(145deg,#112746,#0a182c);
  border:1px solid #294b70;
  border-radius:12px;
  box-shadow:
    0 8px 20px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.b8-left{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

#starter1Box,
#starter2Slot,
.b8-pokemon-slot{
  height:64px;
  border-radius:11px;
}

#starter1Box{
  border-color:#ffd400;
}

#starter2Slot{
  border-color:#00cfff;
}

#starter1Box img{
  width:54px;
  height:54px;
  object-fit:contain;
  image-rendering:auto;
}

#starter2Slot img{
  width:58px;
  height:58px;
  object-fit:contain;
  image-rendering:auto;
}

#starter1Box:hover{
  background:radial-gradient(circle,#203b60,#081322);
  box-shadow:0 0 10px rgba(255,212,59,.18);
}

#starter2Slot:hover{
  background:#0a1a2a;
  box-shadow:0 0 8px rgba(76,195,255,.12);
}

.b8-slot-label{
  position:absolute;
  top:3px;
  left:4px;
  z-index:2;
  padding:2px 4px;
  border-radius:4px;
  background:#123d91;
  color:#fff;
  font-size:7px;
  font-weight:900;
}

.b8-center{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.b8-top{
  min-width:0;
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:1px;
}

.b8-name{
  min-width:0;
  max-width:42%;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  letter-spacing:.1px;
}

.b8-lv{
  flex:0 0 auto;
  padding:2px 6px;
  font-size:9px;
}

.b8-gold{
  font-size:10px;
}

.b8-typing{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:3px;
  min-width:0;
}

<script>
/*
 * Controllo leggero post-caricamento.
 * Non costruisce una seconda mappa e non sostituisce nessuna funzione del CORE.
 */
window.addEventListener("error", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "ERRORE JAVASCRIPT\n\n" +
    (e.error?.stack || e.message || String(e.error || e));
});

window.addEventListener("unhandledrejection", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "PROMISE REJECTION\n\n" +
    (e.reason?.stack || e.reason || String(e.reason));
});

console.log("PokeMisteryRL");
console.log("PKM_ALL:", !!window.PKM_ALL);
console.log("SKILL_DB:", typeof SKILL_DB !== "undefined");
console.log("CORE 1 ready:", !!window.PokeMisteryRL_CoreBridge?.part1Ready);
console.log("CORE 2 ready:", !!window.PokeMisteryRL_CoreBridge?.part2Ready);
console.log("start:", typeof window.start);
</script>
