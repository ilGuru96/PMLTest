
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL — GitHub Pages CORE Test</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050a14;color:#fff;font-family:monospace}
body{display:flex;justify-content:center;padding:12px}
button{font:inherit;color:#fff;background:#0d2035;border:1px solid #315579;border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover{background:#153453}
button:disabled{opacity:.45;cursor:not-allowed}
#gameBox{width:100%;max-width:450px}
#menu{min-height:600px;display:flex;align-items:center;justify-content:center}
.menu-box{width:100%;padding:24px;border:1px solid #315579;border-radius:14px;background:#0a1628;text-align:center}
.menu-box h1{margin:0 0 8px}
.menu-box p{font-size:10px;opacity:.65;line-height:1.5}
#bootStatus{margin:16px 0;text-align:left;font-size:10px;line-height:1.7}
.status-ok{color:#65e6a5}
.status-bad{color:#ff7180}
#startButton{width:100%;font-weight:bold;margin-top:8px}

#game{width:100%}
#eventLog{min-height:20px;margin:8px 0;text-align:center;font-size:11px}
.map-wrap{position:relative;min-height:440px;overflow:hidden;background:#0a1628;border:1px solid #315579;border-radius:12px;padding:16px 10px}
#map{position:relative;z-index:2;min-height:400px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bottomContainer{width:100%;margin-top:8px}
#modal,#pokePreview{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.78)}
#modalContent{width:100%;max-width:450px}
.center,.preview-box{width:100%;max-width:450px;max-height:90vh;overflow:auto;background:#0a1628;border:1px solid #315579;border-radius:12px;padding:14px}
#pokePreview .preview-box{text-align:center}
#ppSprite{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}
.type-badge{display:inline-block;padding:2px 5px;margin:2px;border-radius:4px;font-size:8px}
.bar{width:100%;height:7px;margin:4px 0;overflow:hidden;border-radius:5px;background:#111}
.bar>div{height:100%;background:#55d9ff}
#runLogHeader{padding:7px 8px;background:#0d2035;font-size:10px;cursor:pointer;border:1px solid #315579;border-radius:8px}
#runLogContent{display:none;max-height:120px;overflow:auto;padding:6px 8px;font-size:9px}
.hidden{display:none!important}
#fatal{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;max-width:900px;margin:auto;padding:12px;background:#240d12;border:1px solid #a54b57;border-radius:8px;color:#ffdfe3;white-space:pre-wrap;font:12px monospace}
</style>
</head>

<body>
<main id="gameBox">

  <section id="menu">
    <div class="menu-box">
      <h1>⚡ PokeMisteryRL</h1>
      <p>TEST DIRETTO DEI FILE DEL REPOSITORY<br>GitHub Pages / main</p>

      <div id="bootStatus">
        <div id="s1">⏳ DB Pokémon</div>
        <div id="s2">⏳ DB Mosse</div>
        <div id="s3">⏳ CORE 1</div>
        <div id="s4">⏳ LEVEL SYSTEM</div>
        <div id="s5">⏳ SKILL SYSTEM</div>
        <div id="s6">⏳ DB ITEMS</div>
        <div id="s7">⏳ CORE 2</div>
        <div id="s8">⏳ start()</div>
      </div>

      <button id="startButton" type="button" disabled>
        ⏳ CARICAMENTO CORE...
      </button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div id="eventLog"></div>

    <div class="map-wrap">
      <svg id="mapSvg"></svg>
      <div id="map"></div>
    </div>

    <div id="bottomContainer"></div>

    <div style="margin-top:8px">
      <div id="runLogHeader" onclick="toggleRunLog()">LOG RUN ▼</div>
      <div id="runLogContent"></div>
    </div>
  </section>

  <div id="modal" class="hidden">
    <div id="modalContent"></div>
  </div>

  <div id="pokePreview" class="hidden">
    <div class="preview-box">
      <img id="ppSprite" src="" alt="">
      <h2 id="ppName">—</h2>
      <div id="ppLevel">LV 1</div>
      <div id="ppTypes"></div>
      <div class="bar"><div id="ppHpFill" style="width:100%"></div></div>
      <div id="ppHpText">0/0</div>
      <div>ATK <b id="ppk">0</b></div>
      <div>DEF <b id="ppDef">0</b></div>
      <div>SPD <b id="ppSpd">0</b></div>
      <div id="ppCustomContent"></div>
      <button type="button" onclick="closeTeamPreview();busy=0;PokeMisteryRL.UI.render()">CHIUDI</button>
    </div>
  </div>

</main>

<div id="fatal"></div>

<!-- =========================================================
     I FILE JS SONO CARICATI LOCALMENTE DA GITHUB PAGES.
     NESSUN CODICE DEL CORE È COPIATO QUI DENTRO.
     ========================================================= -->

<!-- 01 — database Pokémon -->
<script src="./DB_PKM.js"></script>

<!--
  DB_PKM.js usa:
      const PKM_ALL = ...

  CORE_1_BASE.js cerca:
      window.PKM_ALL

  Questo è SOLO un bridge di compatibilità dell'HTML.
  DB_PKM.js non viene modificato.
-->
<script>
if (typeof PKM_ALL !== "undefined") {
  window.PKM_ALL = PKM_ALL;
}
</script>

<!-- 02 — database mosse -->
<script src="./MOSSE_PKM.js"></script>

<!-- 03 — CORE BASE -->
<script src="./CORE_1_BASE.js"></script>

<!-- 04 — regioni richieste dal CORE -->
<script src="./LEVEL_SYSTEM_REGION.js"></script>
<script src="./SKILL_SYSTEM_REGION.js"></script>

<!-- 05 — database oggetti -->
<script src="./DB_ITEMS.js"></script>

<!-- 06 — CORE GAMEPLAY -->
<script src="./CORE_2_GAMEPLAY.js"></script>

<!--
  TEAM_SYSTEM_REGION.js e RECRUIT_SYSTEM_REGION.js NON vengono caricati.
  Nei file attuali del repository sono regioni estratte ma il CORE contiene
  ancora le implementazioni inline; caricarle adesso significa duplicare
  Team/TeamRoster/Recruitment. I due file stessi avvertono di non caricarli
  insieme alla vecchia copia inline prima del rewiring del CORE.
-->

<script>
(function(){

  const set = (id, ok, text) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = ok ? "status-ok" : "status-bad";
    el.textContent = (ok ? "✅ " : "❌ ") + text;
  };

  const startButton = document.getElementById("startButton");

  function bootCheck(){

    const dbOk =
      typeof PKM_ALL !== "undefined" &&
      !!window.PKM_ALL;

    const movesOk =
      typeof SKILL_DB !== "undefined";

    const core1Ok =
      !!window.PokeMisteryRL &&
      window.PokeMisteryRL_CoreBridge?.part1Ready === true;

    const levelOk =
      typeof PokeMisteryRL_LevelSystem !== "undefined";

    const skillOk =
      typeof PokeMisteryRL_SkillSystem !== "undefined";

    const itemsOk =
      !!window.PokeMisteryRL_Items?.DB_ITEMS;

    const core2Ok =
      window.PokeMisteryRL_CoreBridge?.part2Ready === true;

    const startOk =
      typeof window.start === "function";

    set("s1", dbOk, "DB Pokémon: " + (dbOk ? "caricato" : "NON caricato"));
    set("s2", movesOk, "DB Mosse: " + (movesOk ? "caricato" : "NON caricato"));
    set("s3", core1Ok, "CORE 1: " + (core1Ok ? "READY" : "NON READY"));
    set("s4", levelOk, "LEVEL SYSTEM: " + (levelOk ? "caricato" : "NON caricato"));
    set("s5", skillOk, "SKILL SYSTEM: " + (skillOk ? "caricato" : "NON caricato"));
    set("s6", itemsOk, "DB ITEMS: " + (itemsOk ? "caricato" : "NON caricato"));
    set("s7", core2Ok, "CORE 2: " + (core2Ok ? "READY" : "NON READY"));
    set("s8", startOk, "start(): " + (startOk ? "FUNCTION" : "NON DISPONIBILE"));

    if (core2Ok && startOk) {
      startButton.disabled = false;
      startButton.textContent = "▶ AVVIA RUN";
    } else {
      startButton.disabled = true;
      startButton.textContent = "❌ CORE NON PRONTO";
    }

    console.table({
      PKM_ALL: typeof PKM_ALL,
      window_PKM_ALL: typeof window.PKM_ALL,
      SKILL_DB: typeof SKILL_DB,
      PokeMisteryRL: typeof window.PokeMisteryRL,
      CORE_1_READY: window.PokeMisteryRL_CoreBridge?.part1Ready,
      LEVEL_SYSTEM: typeof PokeMisteryRL_LevelSystem,
      SKILL_SYSTEM: typeof PokeMisteryRL_SkillSystem,
      ITEMS: typeof window.PokeMisteryRL_Items,
      CORE_2_READY: window.PokeMisteryRL_CoreBridge?.part2Ready,
      start: typeof window.start
    });
  }

  startButton.addEventListener("click", function(){
    if (typeof window.start !== "function") {
      showFatal("CORE caricato ma window.start non è una funzione.");
      return;
    }

    try {
      window.start();
    } catch (err) {
      showFatal(
        "ERRORE DURANTE start()\n\n" +
        (err?.stack || err)
      );
      console.error(err);
    }
  });

  window.addEventListener("error", function(e){
    showFatal(
      "ERRORE JAVASCRIPT\n\n" +
      (e.error?.stack || e.message || String(e.error || e))
    );
  });

  window.addEventListener("unhandledrejection", function(e){
    showFatal(
      "PROMISE REJECTION\n\n" +
      (e.reason?.stack || e.reason || String(e.reason))
    );
  });

  function showFatal(text){
    const el = document.getElementById("fatal");
    if (!el) return;
    el.style.display = "block";
    el.textContent = text;
  }

  bootCheck();

})();
</script>

</body>
</html>
