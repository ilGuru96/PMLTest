<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL</title>

<style>
  /* ============================================================
   PokeMisteryRL
   STYLE REWORK
   CORE JS COMPATIBLE
   ============================================================ */


/* ============================================================
   01. RESET / BASE
   ============================================================ */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#050914;
}

body{
    min-height:100vh;

    margin:0;
    padding:10px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #10213d 0%,
            #08111f 35%,
            #050914 75%
        );

    color:#f5f8ff;

    font-family:
        monospace,
        "Courier New",
        sans-serif;

    text-align:center;

    overflow-x:hidden;
}

button{
    appearance:none;

    border:1px solid #41658e;
    border-radius:8px;

    padding:8px 14px;
    margin:4px;

    background:
        linear-gradient(
            180deg,
            #294b78,
            #183252
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            #38679f,
            #21446f
        );

    border-color:#5d91c8;

    box-shadow:
        0 0 12px rgba(70,150,255,.18);
}

button:active{
    transform:scale(.96);
}

button.danger{
    background:
        linear-gradient(
            180deg,
            #8b3838,
            #602525
        );

    border-color:#b85b5b;
}

button.danger:hover{
    background:
        linear-gradient(
            180deg,
            #a84747,
            #742d2d
        );
}


/* ============================================================
   02. UTILITIES
   ============================================================ */

.hidden{
    display:none!important;
}


/* ============================================================
   03. MENU
   ============================================================ */

#menu{
    width:min(100%,450px);

    min-height:100vh;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;
}

#menu h1{
    margin:0 0 20px;

    color:#55d9ff;

    font-size:24px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(0,220,255,.55),
        0 0 24px rgba(0,220,255,.2);
}

#menu button{
    min-width:210px;
}


/* ============================================================
   04. GAME
   ============================================================ */

#game{
    width:100%;
}

#gameBox{
    width:100%;
    max-width:450px;

    margin:0 auto;
}


/* ============================================================
   05. MAP WRAPPER
   ============================================================ */

.map-wrap{
    position:relative;

    width:100%;
    min-height:440px;

    padding:14px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(20,65,105,.4),
            transparent 55%
        ),
        #081525;

    border:1px solid #315579;
    border-radius:16px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 8px 25px rgba(0,0,0,.25);
}


/* ============================================================
   MAP SVG
   ============================================================ */

#mapSvg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;
}


/* ============================================================
   MAP
   ============================================================ */

#map{
    position:relative;

    z-index:1;

    width:100%;
}

.map-row{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    margin:15px 0;
}

.node{
    position:relative;

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #315579;

    background:
        radial-gradient(
            circle,
            #182c45 0%,
            #0b1422 75%
        );

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.node:hover{
    transform:scale(1.06);
}

.node.available{
    border-color:#ffd43b;

    background:
        radial-gradient(
            circle,
            #3b3505,
            #171600
        );

    box-shadow:
        0 0 7px #ffd43b,
        0 0 18px rgba(255,204,0,.45);

    transform:scale(1.12);
}

.node.current{
    border-color:#00e5ff;

    background:
        radial-gradient(
            circle,
            #063b47,
            #061b23
        );

    box-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0,229,255,.4);
}

.node.done{
    opacity:.45;
}

.node.locked{
    opacity:.22;

    pointer-events:none;
}


/* ============================================================
   MAP CONNECTIONS
   ============================================================ */

.map-line{
    stroke:#315579;

    stroke-width:2;

    opacity:.55;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

.map-line.available{
    stroke:#ffd43b;

    stroke-width:2.5;

    opacity:1;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}


/* ============================================================
   06. BOTTOM CONTAINER
   ============================================================ */

#bottomContainer{
    width:100%;

    margin-top:8px;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #112746,
            #0a182c
        );

    border:1px solid #294b70;
    border-radius:16px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.035);
}


/* ============================================================
   07. MAIN HUD GRID
   ============================================================ */

.bottom-v8{
    width:100%;

    min-height:142px;

    display:grid;

    grid-template-columns:
        17fr
        59fr
        24fr;

    gap:8px;

    text-align:left;
}


/* ============================================================
   08. LEFT HUD
   ============================================================ */

.b8-left{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    gap:5px;
}


/* ============================================================
   STARTER 1
   ============================================================ */

#starter1Box{
    width:100%;
    height:68px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #182d4c,
            #071020
        );

    border:2px solid #ffd43b;
    border-radius:12px;

    box-shadow:
        0 0 8px rgba(255,212,59,.12);

    cursor:pointer;
}

#starter1Box img{
    width:56px;
    height:56px;

    object-fit:contain;

    image-rendering:pixelated;
}


/* ============================================================
   STARTER 2
   ============================================================ */

#starter2Slot{
    width:100%;
    height:68px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#050a12;

    border:1px solid #315579;
    border-radius:12px;

    color:#7d91aa;

    font-size:10px;
    font-weight:bold;

    cursor:pointer;

    transition:
        border-color .15s ease,
        background .15s ease;
}

#starter2Slot:hover{
    border-color:#4cc3ff;
}

#starter2Slot.filled{
    background:#0b1c2d;

    border-color:#4cc3ff;

    box-shadow:
        0 0 8px rgba(76,195,255,.15);
}

#starter2Slot img{
    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;
}


/* ============================================================
   09. CENTER HUD
   ============================================================ */

.b8-center{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    gap:5px;
}


/* ============================================================
   TOP INFORMATION
   ============================================================ */

.b8-top{
    width:100%;

    min-width:0;

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:nowrap;

    margin-bottom:2px;
}

.b8-name{
    min-width:0;

    overflow:hidden;

    color:#55d9ff;

    font-size:14px;
    font-weight:bold;

    white-space:nowrap;

    text-overflow:ellipsis;

    text-shadow:
        0 0 7px rgba(76,195,255,.25);
}

.b8-lv{
    flex-shrink:0;

    padding:2px 7px;

    background:#182b49;

    border:1px solid #315579;
    border-radius:20px;

    color:#dceaff;

    font-size:10px;

    white-space:nowrap;
}

.b8-gold{
    margin-left:auto;

    flex-shrink:0;

    color:#ffd43b;

    font-size:11px;
    font-weight:bold;

    white-space:nowrap;
}


/* ============================================================
   TYPES
   ============================================================ */

.b8-typing{
    display:flex;

    flex-direction:row;

    gap:3px;

    margin-left:auto;

    flex-shrink:0;
}

.type-badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:3px 6px;

    border-radius:6px;

    color:#fff;

    font-size:8px;
    font-weight:bold;

    line-height:1;

    white-space:nowrap;

    text-align:center;

    text-shadow:
        0 1px 2px rgba(0,0,0,.5);
}


/* ============================================================
   BARS
   ============================================================ */

.b8-bars{
    width:100%;

    display:flex;

    flex-direction:column;

    gap:4px;
}

.b8-bar-row{
    width:100%;

    display:flex;

    align-items:center;

    gap:5px;
}

.b8-icon{
    width:15px;

    flex:0 0 15px;

    font-size:11px;

    text-align:center;
}

.b8-bar-bg{
    position:relative;

    flex:1;

    min-width:0;

    height:10px;

    overflow:hidden;

    background:#03070d;

    border:1px solid #1d3655;
    border-radius:6px;

    box-shadow:
        inset 0 1px 2px rgba(0,0,0,.5);
}

.b8-fill{
    width:0;
    height:100%;

    transition:width .3s ease;
}

.b8-fill.hp{
    background:
        linear-gradient(
            90deg,
            #00d66f,
            #00e5ff
        );

    box-shadow:
        0 0 8px rgba(0,229,255,.25);
}

.b8-fill.fel{
    background:
        linear-gradient(
            90deg,
            #ff6800,
            #ffd23b
        );
}

.b8-value{
    min-width:30px;

    font-size:9px;

    text-align:right;

    white-space:nowrap;
}


/* ============================================================
   STATS
   ============================================================ */

.b8-stats{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:4px;

    padding:4px;

    background:#07111f;

    border:1px solid rgba(49,85,121,.35);
    border-radius:7px;

    font-size:9px;
}

.b8-stats > *{
    min-width:0;

    text-align:center;
}


/* ============================================================
   BONUS
   ============================================================ */

.b8-bonus{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:4px;

    font-size:9px;
}

.b8-chip{
    min-width:0;

    overflow:hidden;

    padding:3px 4px;

    background:#101c31;

    border:1px solid #29445f;
    border-radius:6px;

    text-align:center;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* ============================================================
   10. RIGHT HUD
   ============================================================ */

.b8-right{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:5px;

    padding-left:7px;

    border-left:1px solid rgba(49,85,121,.35);
}


/* ============================================================
   TEAM STORAGE
   ============================================================ */

.b8-team{
    width:100%;

    padding:0;

    background:transparent;

    border:0;

    text-align:center;
}

.b8-team-icon{
    font-size:26px;

    line-height:1;
}

.b8-team-text{
    margin-top:2px;

    color:#ffd06b;

    font-size:10px;
    font-weight:bold;

    white-space:nowrap;
}


/* ============================================================
   TEAM SLOTS
   ============================================================ */

.b8-team-slots{
    width:100%;

    display:flex;

    justify-content:center;

    gap:4px;
}

.team-slot{
    width:22px;
    height:22px;

    flex:0 0 22px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#03070c;

    border:1px solid #315579;
    border-radius:5px;

    color:#6d819b;

    font-size:10px;

    cursor:pointer;
}

.team-slot:hover{
    border-color:#4cc3ff;
}

.team-slot.filled{
    background:#092415;

    border-color:#2ecc71;

    box-shadow:
        0 0 7px rgba(46,204,113,.15);
}

.team-slot img{
    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;
}


/* ============================================================
   ACTION BUTTONS
   ============================================================ */

.b8-actions{
    width:100%;

    display:flex;

    justify-content:center;

    gap:5px;

    margin-top:auto;
}

.b8-btn{
    width:30px;
    height:30px;

    margin:0;
    padding:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#17355e;

    border:1px solid #315f93;
    border-radius:7px;

    color:#fff;

    font-size:14px;
}


/* ============================================================
   11. GENERAL EVENT LOG
   ============================================================ */

#eventLog{
    min-height:18px;

    margin-top:5px;

    color:#8edfff;

    font-size:10px;

    text-align:center;

    pointer-events:none;
}


/* ============================================================
   12. BATTLE
   ============================================================ */

#battleFinal{
    width:100%;

    font-size:12px;
}

.bf-top{
    display:flex;

    gap:8px;

    margin-bottom:8px;
}

.bf-hp{
    flex:1;

    padding:5px;

    background:#03070c;

    border:1px solid #315579;
    border-radius:7px;
}

.bf-field{
    display:flex;

    align-items:center;
    justify-content:space-around;

    margin:8px 0;
    padding:12px;

    background:
        radial-gradient(
            ellipse at center,
            #112b45,
            #071321
        );

    border:1px solid #213e5d;
    border-radius:10px;
}

.bf-sprite{
    position:relative;
}

.bf-sprite img{
    width:72px;
    height:72px;

    object-fit:contain;

    image-rendering:pixelated;
}

.bf-sprite.hit{
    animation:hitShake .25s ease;
}

@keyframes hitShake{
    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }
}

.bf-logRow{
    display:flex;

    gap:6px;

    align-items:stretch;
}

.bf-log{
    flex:1;

    height:60px;

    overflow:auto;

    padding:5px;

    background:#02050a;

    border:1px solid #1c334d;
    border-radius:7px;

    color:#d9e8f5;

    font-size:11px;

    text-align:left;
}

.bf-fleeBox{
    display:flex;

    align-items:center;
    justify-content:center;
}

.btn-flee{
    min-width:55px;

    padding:7px;

    background:#663434;
}


/* ============================================================
   BATTLE TEAM
   ============================================================ */

.bf-team{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:8px;
}

.team-label{
    grid-column:1/-1;

    color:#80cfff;

    font-size:10px;
    font-weight:bold;

    text-align:left;
}

.poke-card{
    min-width:0;

    padding:5px;

    background:#03070c;

    border:1px solid #294967;
    border-radius:8px;

    text-align:center;
}

.poke-card.empty{
    opacity:.5;
}

.poke-card img{
    width:40px;
    height:40px;

    object-fit:contain;

    image-rendering:pixelated;
}

.poke-name{
    overflow:hidden;

    font-size:9px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.poke-lv{
    margin-top:2px;

    color:#a9bfd5;

    font-size:9px;
}

.mini-bar{
    height:5px;

    margin-top:3px;

    overflow:hidden;

    background:#000;

    border-radius:4px;
}

.mini-bar > div{
    height:100%;

    background:#28d67b;

    transition:width .25s ease;
}


/* ============================================================
   DAMAGE NUMBERS
   ============================================================ */

.dmg-num{
    position:absolute;

    left:50%;
    top:10px;

    z-index:10;

    transform:translateX(-50%);

    pointer-events:none;

    font-size:16px;
    font-weight:bold;

    animation:damageFloat .9s ease forwards;

    text-shadow:
        0 2px 3px #000;
}

.dmg-num.crit{
    font-size:20px;
}

.dmg-num.heal{
    font-size:16px;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}


/* ============================================================
   13. GENERAL MODAL
   ============================================================ */

#modal{
    position:fixed;

    inset:0;

    z-index:99;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:12px;

    background:rgba(0,0,0,.86);

    backdrop-filter:blur(3px);
}

#modalContent{
    width:100%;

    min-width:300px;
    max-width:400px;

    max-height:90vh;

    overflow:auto;

    padding:18px;

    background:
        linear-gradient(
            145deg,
            #14243c,
            #0b1525
        );

    border:1px solid #466b96;
    border-radius:14px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);
}

.center{
    text-align:center;
}

.center h2{
    margin-top:0;
}


/* ============================================================
   14. POKÉMON PREVIEW
   ============================================================ */

#pokePreview{
    position:fixed;

    inset:0;

    z-index:999;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:12px;

    background:rgba(0,0,0,.86);

    backdrop-filter:blur(3px);
}

#pokePreview.hidden{
    display:none!important;
}

.pp-box{
    position:relative;

    width:100%;
    max-width:340px;

    padding:14px;

    background:
        linear-gradient(
            145deg,
            #142744,
            #0b1729
        );

    border:1px solid #3b6b9d;
    border-radius:16px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.6);
}


/* ============================================================
   PREVIEW TOP
   ============================================================ */

.pp-top{
    position:relative;

    display:flex;

    gap:10px;
}

.pp-sprite-wrap{
    flex:0 0 72px;
}

.pp-top img{
    width:72px;
    height:72px;

    display:block;

    object-fit:contain;

    background:#02060b;

    border:1px solid #263f5d;
    border-radius:10px;

    image-rendering:pixelated;
}

.pp-info{
    min-width:0;

    flex:1;

    text-align:left;
}

.pp-info h3{
    margin:0 28px 4px 0;

    overflow:hidden;

    color:#55d9ff;

    font-size:16px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.pp-lv{
    display:inline-block;

    margin-bottom:5px;

    padding:2px 7px;

    background:#1a304e;

    border:1px solid #355679;
    border-radius:12px;

    font-size:9px;
}

.pp-types{
    display:flex;

    flex-wrap:wrap;

    gap:3px;

    margin-bottom:6px;
}

.pp-hp{
    width:100%;
    height:9px;

    overflow:hidden;

    background:#000;

    border:1px solid #1c3853;
    border-radius:5px;
}

.pp-fill{
    width:0;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #00d66f,
            #00e5ff
        );

    transition:width .3s ease;
}

#ppHpText{
    display:block;

    margin-top:2px;

    color:#a8bfd4;

    font-size:9px;
}


/* ============================================================
   PREVIEW CLOSE
   ============================================================ */

.pp-close{
    position:absolute;

    top:0;
    right:0;

    width:25px;
    height:25px;

    margin:0;
    padding:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#05080d;

    border:1px solid #46566a;
    border-radius:6px;

    font-size:13px;
}


/* ============================================================
   PREVIEW STATS
   ============================================================ */

.pp-stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin:10px 0;
    padding:8px;

    background:#07111f;

    border:1px solid #1d3855;
    border-radius:9px;

    font-size:11px;
}

.pp-stats > div{
    text-align:center;
}

.pp-stats b{
    display:block;

    margin-top:2px;

    color:#55d9ff;

    font-size:13px;
}


/* ============================================================
   PREVIEW CUSTOM AREA
   ============================================================ */

.pp-custom{
    padding-top:9px;

    border-top:1px solid rgba(61,96,130,.35);

    text-align:left;
}

.pp-custom h4{
    margin:0 0 7px;

    color:#9ec6e7;

    font-size:11px;
}

.pp-placeholder{
    margin:0;

    opacity:.5;

    font-size:11px;
}

.pp-actions{
    display:flex;

    flex-wrap:wrap;

    gap:4px;

  color:#55d9ff;
}

.b8-quick-items{
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;
  margin-top:2px;
}

.b8-quick-item{
  min-width:0;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  border:1px solid #315579;
  border-radius:6px;
  background:#071321;
  color:#fff;
}

.b8-quick-item.empty{
  opacity:.42;
}

.b8-quick-item .quick-item-icon{
  font-size:17px;
  line-height:1;
}

.b8-quick-item small{
  position:absolute;
  right:3px;
  bottom:2px;
  padding:0 2px;
  border-radius:3px;
  background:rgba(0,0,0,.65);
  color:#ffd43b;
  font-size:7px;
  font-weight:900;
  line-height:1;
}

@media (max-width:500px){
  .b8-quick-item{
    height:30px;
  }

  .b8-quick-item .quick-item-icon{
    font-size:15px;
  }

  .b8-quick-item small{
    font-size:6px;
  }
}

/* Gli slot item del CENTER occupano sempre la stessa riga,
   indipendentemente dalla presenza/assenza di S2. */
#bottomContainer .b8-center{
  position:relative !important;
  padding-bottom:40px !important;
}

#bottomContainer .b8-quick-items{
  position:absolute !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  margin:0 !important;
  z-index:5 !important;
}

#bottomContainer .b8-quick-item:not(.empty){
  cursor:pointer !important;
  transition:
    border-color .15s ease,
    transform .15s ease,
    background .15s ease;
}
#bottomContainer .b8-quick-item:not(.empty):hover{
  border-color:#4cc3ff !important;
  background:#102840 !important;
  transform:translateY(-1px);
}
.quick-item-detail{
  max-width:320px;
}
.quick-item-detail-icon{
  font-size:46px;
  line-height:1;
  margin:4px 0 8px;
}
.quick-item-detail h2{
  margin:4px 0;
  color:#55d9ff;
  font-size:18px;
}
.quick-item-detail-rarity{
  margin-bottom:10px;
  color:#ffd43b;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
.quick-item-detail-description{
  margin:10px 0 14px;
  padding:10px;
  border:1px solid rgba(49,85,121,.55);
  border-radius:8px;
  background:#071321;
  color:#dcecff;
  font-size:10px;
  line-height:1.35;
}
.quick-item-detail button{
  width:100%;
  margin-top:6px;
}/* ============================================================

/* ============================================================
   01. RESET / BASE
   ============================================================ */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#050914;
}

body{
    min-height:100vh;

    margin:0;
    padding:10px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #10213d 0%,
            #08111f 35%,
            #050914 75%
        );

    color:#f5f8ff;

    font-family:
        monospace,
        "Courier New",
        sans-serif;

    text-align:center;

    overflow-x:hidden;
}

button{
    appearance:none;

    border:1px solid #41658e;
    border-radius:8px;

    padding:8px 14px;
    margin:4px;

    background:
        linear-gradient(
            180deg,
            #294b78,
            #183252
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            #38679f,
            #21446f
        );

    border-color:#5d91c8;

    box-shadow:
        0 0 12px rgba(70,150,255,.18);
}

button:active{
    transform:scale(.96);
}

button.danger{
    background:
        linear-gradient(
            180deg,
            #8b3838,
            #602525
        );

    border-color:#b85b5b;
}

button.danger:hover{
    background:
        linear-gradient(
            180deg,
            #a84747,
            #742d2d
        );
}


/* ============================================================
   02. UTILITIES
   ============================================================ */

.hidden{
    display:none!important;
}


/* ============================================================
   03. MENU
   ============================================================ */

#menu{
    width:min(100%,450px);

    min-height:100vh;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;
}

#menu h1{
    margin:0 0 20px;

    color:#55d9ff;

    font-size:24px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(0,220,255,.55),
        0 0 24px rgba(0,220,255,.2);
}

#menu button{
    min-width:210px;
}


/* ============================================================
   04. GAME
   ============================================================ */

#game{
    width:100%;
}

#gameBox{
    width:100%;
    max-width:450px;

    margin:0 auto;
}


/* ============================================================
   05. MAP WRAPPER
   ============================================================ */

.map-wrap{
    position:relative;

    width:100%;
    min-height:440px;

    padding:14px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(20,65,105,.4),
            transparent 55%
        ),
        #081525;

    border:1px solid #315579;
    border-radius:16px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 8px 25px rgba(0,0,0,.25);
}


/* ============================================================
   MAP SVG
   ============================================================ */

#mapSvg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;
}


/* ============================================================
   MAP
   ============================================================ */

#map{
    position:relative;

    z-index:1;

    width:100%;
}

.map-row{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    margin:15px 0;
}

.node{
    position:relative;

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #315579;

    background:
        radial-gradient(
            circle,
            #182c45 0%,
            #0b1422 75%
        );

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.node:hover{
    transform:scale(1.06);
}

.node.available{
    border-color:#ffd43b;

    background:
        radial-gradient(
            circle,
            #3b3505,
            #171600
        );

    box-shadow:
        0 0 7px #ffd43b,
        0 0 18px rgba(255,204,0,.45);

    transform:scale(1.12);
}

.node.current{
    border-color:#00e5ff;

    background:
        radial-gradient(
            circle,
            #063b47,
            #061b23
        );

    box-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0,229,255,.4);
}

.node.done{
    opacity:.45;
}

.node.locked{
    opacity:.22;

    pointer-events:none;
}


/* ============================================================
   MAP CONNECTIONS
   ============================================================ */

.map-line{
    stroke:#315579;

    stroke-width:2;

    opacity:.55;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

.map-line.available{
    stroke:#ffd43b;

    stroke-width:2.5;

    opacity:1;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}


/* ============================================================
   06. BOTTOM CONTAINER
   ============================================================ */

#bottomContainer{
    width:100%;

    margin-top:8px;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #112746,
            #0a182c
        );

    border:1px solid #294b70;
    border-radius:16px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.035);
}


/* ============================================================
   07. MAIN HUD GRID
   ============================================================ */

.bottom-v8{
    width:100%;

    min-height:142px;

    display:grid;

    grid-template-columns:
        17fr
        59fr
        24fr;

    gap:8px;

    text-align:left;
}


/* ============================================================
   08. LEFT HUD
   ============================================================ */

.b8-left{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    gap:5px;
}


/* ============================================================
   STARTER 1
   ============================================================ */

#starter1Box{
    width:100%;
    height:68px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #182d4c,
            #071020
        );

    border:2px solid #ffd43b;
    border-radius:12px;

    box-shadow:
        0 0 8px rgba(255,212,59,.12);

    cursor:pointer;
}

#starter1Box img{
    width:56px;
    height:56px;

    object-fit:contain;

    image-rendering:pixelated;
}


/* ============================================================
   STARTER 2
   ============================================================ */

#starter2Slot{
    width:100%;
    height:68px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#050a12;

    border:1px solid #315579;
    border-radius:12px;

    color:#7d91aa;

    font-size:10px;
    font-weight:bold;

    cursor:pointer;

    transition:
        border-color .15s ease,
        background .15s ease;
}

#starter2Slot:hover{
    border-color:#4cc3ff;
}

#starter2Slot.filled{
    background:#0b1c2d;

    border-color:#4cc3ff;

    box-shadow:
        0 0 8px rgba(76,195,255,.15);
}

#starter2Slot img{
    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;
}


/* ============================================================
   09. CENTER HUD
   ============================================================ */

.b8-center{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    gap:5px;
}


/* ============================================================
   TOP INFORMATION
   ============================================================ */

.b8-top{
    width:100%;

    min-width:0;

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:nowrap;

    margin-bottom:2px;
}

.b8-name{
    min-width:0;

    overflow:hidden;

    color:#55d9ff;

    font-size:14px;
    font-weight:bold;

    white-space:nowrap;

    text-overflow:ellipsis;

    text-shadow:
        0 0 7px rgba(76,195,255,.25);
}

.b8-lv{
    flex-shrink:0;

    padding:2px 7px;

    background:#182b49;

    border:1px solid #315579;
    border-radius:20px;

    color:#dceaff;

    font-size:10px;

    white-space:nowrap;
}

.b8-gold{
    margin-left:auto;

    flex-shrink:0;

    color:#ffd43b;

    font-size:11px;
    font-weight:bold;

    white-space:nowrap;
}


/* ============================================================
   TYPES
   ============================================================ */

.b8-typing{
    display:flex;

    flex-direction:row;

    gap:3px;

    margin-left:auto;

    flex-shrink:0;
}

.type-badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:3px 6px;

    border-radius:6px;

    color:#fff;

    font-size:8px;
    font-weight:bold;

    line-height:1;

    white-space:nowrap;

    text-align:center;

    text-shadow:
        0 1px 2px rgba(0,0,0,.5);
}


/* ============================================================
   BARS
   ============================================================ */

.b8-bars{
    width:100%;

    display:flex;

    flex-direction:column;

    gap:4px;
}

.b8-bar-row{
    width:100%;

    display:flex;

    align-items:center;

    gap:5px;
}

.b8-icon{
    width:15px;

    flex:0 0 15px;

    font-size:11px;

    text-align:center;
}

.b8-bar-bg{
    position:relative;

    flex:1;

    min-width:0;

    height:10px;

    overflow:hidden;

    background:#03070d;

    border:1px solid #1d3655;
    border-radius:6px;

    box-shadow:
        inset 0 1px 2px rgba(0,0,0,.5);
}

.b8-fill{
    width:0;
    height:100%;

    transition:width .3s ease;
}

.b8-fill.hp{
    background:
        linear-gradient(
            90deg,
            #00d66f,
            #00e5ff
        );

    box-shadow:
        0 0 8px rgba(0,229,255,.25);
}

.b8-fill.fel{
    background:
        linear-gradient(
            90deg,
            #ff6800,
            #ffd23b
        );
}

.b8-value{
    min-width:30px;

    font-size:9px;

    text-align:right;

    white-space:nowrap;
}


/* ============================================================
   STATS
   ============================================================ */

.b8-stats{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:4px;

    padding:4px;

    background:#07111f;

    border:1px solid rgba(49,85,121,.35);
    border-radius:7px;

    font-size:9px;
}

.b8-stats > *{
    min-width:0;

    text-align:center;
}


/* ============================================================
   BONUS
   ============================================================ */

.b8-bonus{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:4px;

    font-size:9px;
}

.b8-chip{
    min-width:0;

    overflow:hidden;

    padding:3px 4px;

    background:#101c31;

    border:1px solid #29445f;
    border-radius:6px;

    text-align:center;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* ============================================================
   10. RIGHT HUD
   ============================================================ */

.b8-right{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:5px;

    padding-left:7px;

    border-left:1px solid rgba(49,85,121,.35);
}


/* ============================================================
   TEAM STORAGE
   ============================================================ */

.b8-team{
    width:100%;

    padding:0;

    background:transparent;

    border:0;

    text-align:center;
}

.b8-team-icon{
    font-size:26px;

    line-height:1;
}

.b8-team-text{
    margin-top:2px;

    color:#ffd06b;

    font-size:10px;
    font-weight:bold;

    white-space:nowrap;
}


/* ============================================================
   TEAM SLOTS
   ============================================================ */

.b8-team-slots{
    width:100%;

    display:flex;

    justify-content:center;

    gap:4px;
}

.team-slot{
    width:22px;
    height:22px;

    flex:0 0 22px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#03070c;

    border:1px solid #315579;
    border-radius:5px;

    color:#6d819b;

    font-size:10px;

    cursor:pointer;
}

.team-slot:hover{
    border-color:#4cc3ff;
}

.team-slot.filled{
    background:#092415;

    border-color:#2ecc71;

    box-shadow:
        0 0 7px rgba(46,204,113,.15);
}

.team-slot img{
    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;
}


/* ============================================================
   ACTION BUTTONS
   ============================================================ */

.b8-actions{
    width:100%;

    display:flex;

    justify-content:center;

    gap:5px;

    margin-top:auto;
}

.b8-btn{
    width:30px;
    height:30px;

    margin:0;
    padding:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#17355e;

    border:1px solid #315f93;
    border-radius:7px;

    color:#fff;

    font-size:14px;
}


/* ============================================================
   11. GENERAL EVENT LOG
   ============================================================ */

#eventLog{
    min-height:18px;

    margin-top:5px;

    color:#8edfff;

    font-size:10px;

    text-align:center;

    pointer-events:none;
}


/* ============================================================
   12. BATTLE
   ============================================================ */

#battleFinal{
    width:100%;

    font-size:12px;
}

.bf-top{
    display:flex;

    gap:8px;

    margin-bottom:8px;
}

.bf-hp{
    flex:1;

    padding:5px;

    background:#03070c;

    border:1px solid #315579;
    border-radius:7px;
}

.bf-field{
    display:flex;

    align-items:center;
    justify-content:space-around;

    margin:8px 0;
    padding:12px;

    background:
        radial-gradient(
            ellipse at center,
            #112b45,
            #071321
        );

    border:1px solid #213e5d;
    border-radius:10px;
}

.bf-sprite{
    position:relative;
}

.bf-sprite img{
    width:72px;
    height:72px;

    object-fit:contain;

    image-rendering:pixelated;
}

.bf-sprite.hit{
    animation:hitShake .25s ease;
}

@keyframes hitShake{
    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }
}

.bf-logRow{
    display:flex;

    gap:6px;

    align-items:stretch;
}

.bf-log{
    flex:1;

    height:60px;

    overflow:auto;

    padding:5px;

    background:#02050a;

    border:1px solid #1c334d;
    border-radius:7px;

    color:#d9e8f5;

    font-size:11px;

    text-align:left;
}

.bf-fleeBox{
    display:flex;

    align-items:center;
    justify-content:center;
}

.btn-flee{
    min-width:55px;

    padding:7px;

    background:#663434;
}


/* ============================================================
   BATTLE TEAM
   ============================================================ */

.bf-team{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:8px;
}

.team-label{
    grid-column:1/-1;

    color:#80cfff;

    font-size:10px;
    font-weight:bold;

    text-align:left;
}

.poke-card{
    min-width:0;

    padding:5px;

    background:#03070c;

    border:1px solid #294967;
    border-radius:8px;

    text-align:center;
}

.poke-card.empty{
    opacity:.5;
}

.poke-card img{
    width:40px;
    height:40px;

    object-fit:contain;

    image-rendering:pixelated;
}

.poke-name{
    overflow:hidden;

    font-size:9px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.poke-lv{
    margin-top:2px;

    color:#a9bfd5;

    font-size:9px;
}

.mini-bar{
    height:5px;

    margin-top:3px;

    overflow:hidden;

    background:#000;

    border-radius:4px;
}

.mini-bar > div{
    height:100%;

    background:#28d67b;

    transition:width .25s ease;
}


/* ============================================================
   DAMAGE NUMBERS
   ============================================================ */

.dmg-num{
    position:absolute;

    left:50%;
    top:10px;

    z-index:10;

    transform:translateX(-50%);

    pointer-events:none;

    font-size:16px;
    font-weight:bold;

    animation:damageFloat .9s ease forwards;

    text-shadow:
        0 2px 3px #000;
}

.dmg-num.crit{
    font-size:20px;
}

.dmg-num.heal{
    font-size:16px;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}


/* ============================================================
   13. GENERAL MODAL
   ============================================================ */

#modal{
    position:fixed;

    inset:0;

    z-index:99;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:12px;

    background:rgba(0,0,0,.86);

    backdrop-filter:blur(3px);
}

#modalContent{
    width:100%;

    min-width:300px;
    max-width:400px;

    max-height:90vh;

    overflow:auto;

    padding:18px;

    background:
        linear-gradient(
            145deg,
            #14243c,
            #0b1525
        );

    border:1px solid #466b96;
    border-radius:14px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);
}

.center{
    text-align:center;
}

.center h2{
    margin-top:0;
}


/* ============================================================
   14. POKÉMON PREVIEW
   ============================================================ */

#pokePreview{
    position:fixed;

    inset:0;

    z-index:999;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:12px;

    background:rgba(0,0,0,.86);

    backdrop-filter:blur(3px);
}

#pokePreview.hidden{
    display:none!important;
}

.pp-box{
    position:relative;

    width:100%;
    max-width:340px;

    padding:14px;

    background:
        linear-gradient(
            145deg,
            #142744,
            #0b1729
        );

    border:1px solid #3b6b9d;
    border-radius:16px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.6);
}


/* ============================================================
   PREVIEW TOP
   ============================================================ */

.pp-top{
    position:relative;

    display:flex;

    gap:10px;
}

.pp-sprite-wrap{
    flex:0 0 72px;
}

.pp-top img{
    width:72px;
    height:72px;

    display:block;

    object-fit:contain;

    background:#02060b;

#battleFinal .bf-name-row b{
  display:block !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
}

#battleFinal .bf-hp .bar{
  width:100% !important;
  height:9px !important;
  overflow:hidden !important;
  background:#000 !important;
  border:1px solid #1c3853 !important;
  border-radius:5px !important;
}

#battleFinal .bf-hp .bar > div{

  height:100% !important;
  background:linear-gradient(90deg,#00d66f,#00e5ff) !important;

}

#battleFinal .bf-hp-text{
  display:block !important;
  min-height:12px !important;
  text-align:center !important;
  font-size:8px !important;
  line-height:1.1 !important;
  white-space:nowrap !important;
}

#battleFinal .bf-sprite.s2.dead img{
  filter:grayscale(1) !important;
  opacity:.45 !important;
}

/* Nessun livello/statistica nel pannello superiore del fight. */
#battleFinal .bf-top .bf-stats,
#battleFinal .bf-top .poke-lv,
#battleFinal .bf-top .bf-level,
#battleFinal .bf-top .bf-atk,
#battleFinal .bf-top .bf-def,
#battleFinal .bf-top .bf-spd{
  display:none !important;
}

#battleFinal .bf-hp-text{
  display:block !important;
  margin-top:1px !important;
  text-align:center !important;
  font-size:8px !important;
  line-height:1.1 !important;
  white-space:nowrap !important;
}
#battleFinal .bf-top .bar{
  display:block !important;
  width:100% !important;

  overflow:hidden !important;
  background:#000 !important;

  border-radius:5px !important;
}
#battleFinal .bf-top .bar > div{
  display:block !important;
  height:100% !important;
  min-width:0 !important;
  transition:width .25s ease !important;
}

#hpTextSide,
#s2HpTxt{
  min-width:35px !important;
  font-size:8px !important;
  white-space:nowrap !important;
  text-align:right !important;
}

.skill-result-flow{
  display:grid;
  grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);
  align-items:center;
  gap:6px;
  margin:12px 0;
}
.skill-result-old,
.skill-result-new{
  min-width:0;
}
.skill-result-old{
  border-color:#5b6780 !important;
}
.skill-result-new{
  border-color:#4cc3ff !important;
}
.skill-result-node .skill-arrow{
  text-align:center;
  font-size:22px;
  font-weight:900;
  color:#55d9ff;
}

.b8-quick-items{
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;
  margin-top:2px;
}

.b8-quick-item{
  min-width:0;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  border:1px solid #315579;
  border-radius:6px;
  background:#071321;
  color:#fff;
}

.b8-quick-item.empty{
  opacity:.42;
}

.b8-quick-item .quick-item-icon{
  font-size:17px;
  line-height:1;
}

.b8-quick-item small{
  position:absolute;
  right:3px;
  bottom:2px;
  padding:0 2px;
  border-radius:3px;
  background:rgba(0,0,0,.65);
  color:#ffd43b;
  font-size:7px;
  font-weight:900;
  line-height:1;
}

@media (max-width:500px){
  .b8-quick-item{
    height:30px;
  }

  .b8-quick-item .quick-item-icon{
    font-size:15px;
  }

  .b8-quick-item small{
    font-size:6px;
  }
}

/* Gli slot item del CENTER occupano sempre la stessa riga,

#bottomContainer .b8-center{
  position:relative !important;
  padding-bottom:40px !important;
}

#bottomContainer .b8-quick-items{
  position:absolute !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  margin:0 !important;
  z-index:5 !important;
}

#bottomContainer .b8-quick-item:not(.empty){
  cursor:pointer !important;
  transition:
    border-color .15s ease,
    transform .15s ease,
    background .15s ease;
}
#bottomContainer .b8-quick-item:not(.empty):hover{
  border-color:#4cc3ff !important;
  background:#102840 !important;
  transform:translateY(-1px);
}
.quick-item-detail{
  max-width:320px;
}
.quick-item-detail-icon{
  font-size:46px;
  line-height:1;
  margin:4px 0 8px;
}
.quick-item-detail h2{
  margin:4px 0;
  color:#55d9ff;
  font-size:18px;
}
.quick-item-detail-rarity{
  margin-bottom:10px;
  color:#ffd43b;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
.quick-item-detail-description{
  margin:10px 0 14px;
  padding:10px;

}

  width:100%;
  margin-top:6px;
}

<body>

<main id="gameBox">

 <!-- =========================================================
       MENU PRINCIPALE
       ========================================================= -->

  <main id="menu">

    <h1>CORE v7 CLEAN</h1>

    <button onclick="start()">
      🎲 RUN RANDOM
    </button>

    <button onclick="start(150)">
      MEWTWO TEST
    </button>

  </main>

  <!-- =========================================================
       GAME
       ========================================================= -->

  <main id="game" class="hidden">

    <section id="gameBox">

      <!-- MAPPA -->

      <section class="map-wrap">

        <svg
          id="mapSvg"
          aria-hidden="true"
        ></svg>

        <div
          id="map"
          aria-label="Mappa della run"
        ></div>

      </section>

      <!-- HUD / BOTTOM PANEL -->

      <section id="bottomContainer"></section>

      <!-- EVENT LOG -->

      <div
        id="eventLog"
        aria-live="polite"
      ></div>

    </section>

  </main>

  <!-- =========================================================
       MODAL GENERALE
       ========================================================= -->

  <div
    id="modal"
    class="hidden"
    onclick="if(event.target.id==='modal') closeModal()"
  >
    <div id="modalContent"></div>
  </div>

  <!-- =========================================================
       POKÉMON PREVIEW
       ========================================================= -->

  <section
    id="pokePreview"
    class="hidden"
    aria-hidden="true"
  >

    <div class="pp-box">

      <!-- HEADER -->

      <div class="pp-top">

        <div class="pp-sprite-wrap">

          <img
            id="ppSprite"
            src=""
            alt="Pokémon"
          >

        </div>

        <div class="pp-info">

          <h3 id="ppName">-</h3>

          <span
            id="ppLevel"
            class="pp-lv"
          >
            LV 1
          </span>

          <div
            id="ppTypes"
            class="pp-types"
          ></div>

          <div class="pp-hp">

            <div
              id="ppHpFill"
              class="pp-fill"
            ></div>

          </div>

          <small id="ppHpText">
            0/0
          </small>

        </div>

        <button
          class="pp-close"
          onclick="closeTeamPreview()"
          aria-label="Chiudi"
        >
          ✕
        </button>

      </div>

      <!-- STATISTICHE -->

      <div class="pp-stats">

        <div>
          ATK
          <b id="ppk">0</b>
        </div>

        <div>
          DEF
          <b id="ppDef">0</b>
        </div>

        <div>
          SPD
          <b id="ppSpd">0</b>
        </div>

      </div>

      <!-- =======================================================
           INFO BOX / SKILL
           ======================================================= -->

      <div class="pp-custom">

        <h4>Info Box</h4>

        <div id="ppCustomContent">

          <div class="pp-skills">

            <div
              id="ppSkill"
              class="pp-skill-pill"
            >

              <span
                id="ppSkillName"
                class="pp-skill-name"
              >
                --
              </span>

              <span
                id="ppSkillPower"
                class="pp-skill-power"
              >
                PWR --
              </span>

            </div>

          </div>

          <div class="pp-actions">

            <button id="btnMossa">
              🔧 Mossa
            </button>

            <button class="danger">
              Rilascia
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>
